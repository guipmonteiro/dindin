<!DOCTYPE html>
<html lang="pt-BR" data-skin="rosa" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dindin">
<meta name="description" content="Orçamento do mês leve e bonito, com importação de extrato e fatura do Nubank e do Safra.">
<title>Dindin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Dindin — orçamento do mês
   Layout: app de uma coluna (celular primeiro), centralizado no desktop dentro de uma moldura.
   Dois estilos (Rosa / Sóbrio), cada um com versão clara e escura. */
:root {
  --bg: #fff3f7;
  --bg-deco: #fde3ec;
  --surface: #ffffff;
  --surface-2: #fff0f5;
  --ink: #3b1230;
  --ink-2: #74445f;
  --muted: #a27b91;
  --line: #f4d9e4;
  --accent: #d63f7a;
  --accent-strong: #b52c64;
  --accent-ink: #ffffff;
  --accent-soft: #fde0eb;
  --hero-a: #f0709f;
  --hero-b: #d63f7a;
  --hero-c: #a8326a;
  --hero-ink: #ffffff;
  --good: #16865a;
  --good-soft: #dff5ea;
  --warn: #b86e00;
  --warn-soft: #fff0d6;
  --bad: #c9334b;
  --bad-soft: #fde2e6;
  --c-in: #6a4fd0;
  --c-out: #d63f7a;
  --grid: #f6e4ec;
  --shadow: 0 14px 34px -18px rgba(181, 44, 100, .45);
  --shadow-sm: 0 4px 14px -8px rgba(181, 44, 100, .35);
  --radius: 22px;
  --radius-sm: 14px;
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display-weight: 600;
  --pill: 999px;
  color-scheme: light;
}
/* Rosa — noite */
:root[data-mode="dark"] {
  --bg: #1d0d17;
  --bg-deco: #2b1222;
  --surface: #2a1522;
  --surface-2: #341b2b;
  --ink: #ffe9f2;
  --ink-2: #e2b5ca;
  --muted: #b98aa1;
  --line: #45273a;
  --accent: #ff7aa8;
  --accent-strong: #ff9dbf;
  --accent-ink: #2a0b1c;
  --accent-soft: #4a1f35;
  --hero-a: #b4306b;
  --hero-b: #8e2357;
  --hero-c: #5a1438;
  --good: #4fd394;
  --good-soft: #173a2b;
  --warn: #ffc25c;
  --warn-soft: #3d2c10;
  --bad: #ff7d8f;
  --bad-soft: #4a1823;
  --c-in: #8a76ea;
  --c-out: #e0578d;
  --grid: #3a2030;
  --shadow: 0 16px 40px -20px rgba(0, 0, 0, .7);
  --shadow-sm: 0 4px 14px -8px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
/* Sóbrio — azul-marinho e dourado */
:root[data-skin="sobrio"] {
  --bg: #eef1f5;
  --bg-deco: #e2e7ee;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #0d1b2c;
  --ink-2: #3b4a5e;
  --muted: #748195;
  --line: #dfe4eb;
  --accent: #14365c;
  --accent-strong: #0b2440;
  --accent-ink: #ffffff;
  --accent-soft: #dde6f1;
  --gold: #a8803f;
  --hero-a: #1c4672;
  --hero-b: #12304f;
  --hero-c: #0a1d33;
  --good: #11775a;
  --good-soft: #dcf1e8;
  --warn: #9a6200;
  --warn-soft: #fbefd8;
  --bad: #b8323a;
  --bad-soft: #f8e0e2;
  --c-in: #1f6fb2;
  --c-out: #b8883e;
  --grid: #e9edf2;
  --shadow: 0 14px 30px -20px rgba(13, 27, 44, .55);
  --shadow-sm: 0 3px 10px -6px rgba(13, 27, 44, .4);
  --radius: 14px;
  --radius-sm: 10px;
  --font-display: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --display-weight: 800;
  color-scheme: light;
}
:root[data-skin="sobrio"][data-mode="dark"] {
  --bg: #0c131d;
  --bg-deco: #111a27;
  --surface: #18212e;
  --surface-2: #1e2938;
  --ink: #e9eef5;
  --ink-2: #b4c0cf;
  --muted: #8593a6;
  --line: #2a3546;
  --accent: #c9a15e;
  --accent-strong: #ddb877;
  --accent-ink: #13100a;
  --accent-soft: #2f2a1f;
  --gold: #c9a15e;
  --hero-a: #1b3553;
  --hero-b: #13263d;
  --hero-c: #0c1828;
  --good: #46c793;
  --good-soft: #13352a;
  --warn: #f0b552;
  --warn-soft: #3a2d12;
  --bad: #f07a80;
  --bad-soft: #43191d;
  --c-in: #4a86c8;
  --c-out: #b0843e;
  --grid: #253043;
  --shadow: 0 16px 40px -20px rgba(0, 0, 0, .8);
  --shadow-sm: 0 4px 14px -8px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg-deco);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .35s ease, color .35s ease;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num, .money { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
svg { display: block; }
p svg, .small svg, .hint svg, .chip-state svg { display: inline-block; vertical-align: -3px; }

/* moldura */
.stage { min-height: 100%; display: flex; justify-content: center; }
.app {
  position: relative;
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  display: flex; flex-direction: column;
  transition: background-color .35s ease;
}
@media (min-width: 760px) {
  body {
    background:
      radial-gradient(1200px 600px at 10% 0%, var(--bg-deco), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, var(--accent-soft), transparent 60%),
      var(--bg-deco);
  }
  .stage { padding: 28px 16px; }
  .app {
    min-height: calc(100vh - 56px);
    border-radius: 34px;
    box-shadow: 0 40px 80px -40px rgba(0,0,0,.35), 0 0 0 1px var(--line);
    overflow: hidden;
  }
  :root[data-skin="sobrio"] .app { border-radius: 22px; }
}
.deco-side { display: none; }
@media (min-width: 1100px) {
  .deco-side {
    display: flex; flex-direction: column; gap: 14px;
    width: 280px; padding: 40px 28px; align-self: center; color: var(--ink-2);
  }
  .deco-side h2 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 34px; color: var(--ink); line-height: 1.1; }
  .deco-side p { margin: 0; max-width: 30ch; }
}

/* topo */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(14px + env(safe-area-inset-top)) 18px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.topbar .title { flex: 1; min-width: 0; }
.topbar .hello { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
.topbar h1 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 24px; line-height: 1.15; letter-spacing: -.01em; }
.icon-btn {
  width: 42px; height: 42px; border-radius: var(--pill);
  display: grid; place-items: center; color: var(--ink-2);
  background: var(--surface); box-shadow: var(--shadow-sm);
  transition: transform .15s ease, background .2s;
}
.icon-btn:active { transform: scale(.94); }
.avatar {
  width: 42px; height: 42px; border-radius: var(--pill);
  display: grid; place-items: center; font-size: 22px;
  background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--surface), var(--shadow-sm);
}
.month-switch {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: 0 18px 6px; padding: 6px; border-radius: var(--pill);
  background: var(--surface); box-shadow: var(--shadow-sm);
}
.month-switch button.arrow { width: 36px; height: 36px; border-radius: var(--pill); display: grid; place-items: center; color: var(--ink-2); }
.month-switch button.arrow:hover { background: var(--surface-2); }
.month-switch .label { font-weight: 800; font-size: 15px; }
.month-switch .label small { display: block; font-weight: 700; color: var(--muted); font-size: 11px; text-transform: none; text-align: center; }

/* conteúdo */
main.view { flex: 1; padding: 6px 18px calc(120px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; animation: viewIn .32s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card {
  background: var(--surface); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow-sm);
}
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-h h2 { font-size: 17px; font-weight: 800; }
:root:not([data-skin="sobrio"]) .card-h h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.card-h a, .link { color: var(--accent); font-weight: 800; font-size: 14px; text-decoration: none; cursor: pointer; }
.muted { color: var(--muted); }
.sub { color: var(--ink-2); font-size: 14px; }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* herói */
.hero {
  position: relative; overflow: hidden;
  border-radius: calc(var(--radius) + 6px); padding: 22px 20px 20px;
  color: var(--hero-ink);
  background: linear-gradient(145deg, var(--hero-a) 0%, var(--hero-b) 55%, var(--hero-c) 100%);
  box-shadow: var(--shadow);
}
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.28), transparent 70%);
}
.hero::before { width: 220px; height: 220px; right: -60px; top: -80px; }
.hero::after { width: 160px; height: 160px; left: -50px; bottom: -90px; opacity: .6; }
:root[data-skin="sobrio"] .hero::before { background: radial-gradient(circle, rgba(201,161,94,.30), transparent 70%); }
:root[data-skin="sobrio"] .hero { border-top: 2px solid var(--gold); }
.hero .lbl { font-size: 13px; font-weight: 800; opacity: .9; letter-spacing: .03em; text-transform: uppercase; }
.hero .big { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 42px; line-height: 1.05; letter-spacing: -.02em; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.hero .big.neg { color: #ffe1e6; }
.hero .meta { font-size: 14px; opacity: .92; }
.hero .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.25); margin: 16px 0 8px; overflow: hidden; position: relative; }
.hero .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: #fff; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.hero .bar i.over { background: #ffd2da; }
.hero .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: rgba(255,255,255,.9); border-radius: 2px; }
.hero .bar-legend { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; opacity: .9; }
.hero .daily {
  margin-top: 14px; display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.16); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px;
}
.hero .daily strong { font-size: 17px; }
.hero .rel { position: relative; z-index: 1; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--radius-sm); padding: 12px; box-shadow: var(--shadow-sm); min-width: 0; }
.stat .k { font-size: 12px; font-weight: 800; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.stat .v { font-weight: 800; font-size: 15px; letter-spacing: -.01em; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v.in { color: var(--good); }

/* barras de categoria */
.cat-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; cursor: pointer; }
.cat-row + .cat-row { border-top: 1px solid var(--line); }
.emoji {
  width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 20px;
  background: var(--surface-2);
}
:root[data-skin="sobrio"] .emoji { border-radius: 10px; }
.cat-row .name { font-weight: 800; font-size: 15px; }
.cat-row .hint { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.cat-row .amt { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; }
.cat-row .amt small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
.meter { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; position: relative; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); transition: width .7s cubic-bezier(.2,.8,.2,1); }
.meter i.warn { background: var(--warn); }
.meter i.over { background: var(--bad); }
.meter i.good { background: var(--good); }
.chip-state { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px; }
.chip-state.ok { background: var(--good-soft); color: var(--good); }
.chip-state.warn { background: var(--warn-soft); color: var(--warn); }
.chip-state.over { background: var(--bad-soft); color: var(--bad); }

/* lançamentos */
.day-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 800; color: var(--muted); padding: 4px 4px 0; text-transform: capitalize; }
.tx-list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.tx {
  display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center;
  padding: 12px 14px; width: 100%; text-align: left; transition: background .15s;
}
.tx + .tx { border-top: 1px solid var(--line); }
.tx:hover { background: var(--surface-2); }
.tx .d { font-weight: 800; font-size: 15px; }
.tx .m { font-size: 12.5px; color: var(--muted); font-weight: 700; display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; overflow: hidden; }
.tx .m > * { flex: none; }
.tx .m > span:first-child { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .v { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.tx .v.in { color: var(--good); }
.tx .v.tr { color: var(--muted); }
.tx.ignored .d, .tx.ignored .v { opacity: .55; }
.tag { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.acc { background: var(--accent-soft); color: var(--accent-strong); }
:root[data-mode="dark"] .tag.acc { color: var(--accent); }

/* listas de menu */
.menu { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.menu-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 13px 16px; width: 100%; text-align: left; }
.menu-item + .menu-item { border-top: 1px solid var(--line); }
.menu-item:hover { background: var(--surface-2); }
.menu-item .t { font-weight: 800; }
.menu-item .s { font-size: 13px; color: var(--muted); font-weight: 600; }
.menu-item .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); }
:root[data-mode="dark"] .menu-item .ic { color: var(--accent); }
.section-t { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 6px 4px -6px; }

/* botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 20px; border-radius: var(--pill);
  font-weight: 800; font-size: 16px; background: var(--accent); color: var(--accent-ink);
  box-shadow: var(--shadow-sm); transition: transform .12s ease, filter .2s;
}
.btn:active { transform: scale(.97); }
.btn:hover { filter: brightness(1.05); }
.btn.block { width: 100%; }
.sheet-f .btn { white-space: nowrap; }
.btn.ghost { background: var(--surface-2); color: var(--ink); box-shadow: none; }
.btn.soft { background: var(--accent-soft); color: var(--accent-strong); box-shadow: none; }
:root[data-mode="dark"] .btn.soft { color: var(--accent); }
.btn.danger { background: var(--bad-soft); color: var(--bad); box-shadow: none; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
:root[data-skin="sobrio"] .btn { border-radius: 12px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 0 14px; border-radius: var(--pill);
  background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line);
  font-weight: 800; font-size: 14px; color: var(--ink-2); white-space: nowrap;
}
.chip.on { background: var(--accent); color: var(--accent-ink); box-shadow: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 4px; border-radius: var(--pill); gap: 4px; }
.seg button { min-height: 40px; border-radius: var(--pill); font-weight: 800; color: var(--ink-2); font-size: 14px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.seg button.on.out { color: var(--bad); }
.seg button.on.in { color: var(--good); }
:root[data-skin="sobrio"] .seg, :root[data-skin="sobrio"] .seg button { border-radius: 10px; }

/* navegação inferior */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 30;
  padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
@media (min-width: 760px) { .tabbar { bottom: 28px; } .tabbar { border-radius: 0 0 34px 34px; } }
.tabbar nav {
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: var(--surface); border-radius: 26px; padding: 6px; box-shadow: var(--shadow);
}
:root[data-skin="sobrio"] .tabbar nav { border-radius: 16px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 800; color: var(--muted); border-radius: 18px; }
.tab.on { color: var(--accent); }
.tab.on svg { transform: translateY(-1px); }
.fab {
  justify-self: center; width: 58px; height: 58px; border-radius: 20px; margin-top: -26px;
  display: grid; place-items: center; color: var(--accent-ink);
  background: linear-gradient(145deg, var(--hero-a), var(--accent));
  box-shadow: 0 12px 24px -10px var(--accent), inset 0 0 0 3px rgba(255,255,255,.18);
  transition: transform .15s ease;
}
:root[data-skin="sobrio"] .fab { background: var(--accent); border-radius: 16px; }
.fab:active { transform: scale(.92) rotate(90deg); }

/* folhas (bottom sheets) */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(20, 6, 14, .45); opacity: 0; transition: opacity .25s ease; }
:root[data-skin="sobrio"] .scrim { background: rgba(5, 12, 22, .5); }
.scrim.in { opacity: 1; }
.sheet {
  position: fixed; z-index: 51; left: 50%; bottom: 0; transform: translate(-50%, 100%);
  width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh;
  display: flex; flex-direction: column;
  background: var(--bg); border-radius: 28px 28px 0 0;
  box-shadow: 0 -20px 50px -20px rgba(0,0,0,.35);
  transition: transform .34s cubic-bezier(.2,.8,.2,1);
}
.sheet.in { transform: translate(-50%, 0); }
.sheet.full { height: 100vh; height: 100dvh; max-height: none; border-radius: 0; }
@media (min-width: 760px) { .sheet { bottom: 28px; border-radius: 28px; } .sheet.full { height: calc(100vh - 56px); border-radius: 28px; } }
:root[data-skin="sobrio"] .sheet { border-radius: 18px 18px 0 0; }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 10px auto 0; flex: none; }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 12px 18px 8px; flex: none; }
.sheet-h h2 { flex: 1; font-size: 20px; font-family: var(--font-display); font-weight: var(--display-weight); }
.sheet-b > * { flex-shrink: 0; }
.sheet.full .sheet-b { flex: 1; }
.sheet-b { overflow-y: auto; padding: 6px 18px 18px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.sheet-f { padding: 10px 18px calc(14px + env(safe-area-inset-bottom)); flex: none; display: flex; gap: 10px; border-top: 1px solid var(--line); background: var(--bg); }

/* formulários */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl-sm { font-size: 13px; font-weight: 800; color: var(--ink-2); }
.input, select.input, textarea.input {
  width: 100%; min-height: 50px; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1.5px solid var(--line); outline: none; font-size: 16px; font-weight: 700;
  transition: border-color .2s, box-shadow .2s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
textarea.input { min-height: 80px; resize: vertical; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

/* teclado de valor */
.amount-display { text-align: center; padding: 6px 0 2px; }
.amount-display .cur { font-size: 20px; font-weight: 800; color: var(--muted); vertical-align: top; margin-right: 4px; }
.amount-display .val { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 42px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.amount-display.out .val { color: var(--ink); }
.amount-display.in .val { color: var(--good); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { min-height: 46px; border-radius: 16px; background: var(--surface); font-size: 22px; font-weight: 800; box-shadow: var(--shadow-sm); transition: transform .08s, background .15s; }
.keypad button:active { transform: scale(.95); background: var(--accent-soft); }
:root[data-skin="sobrio"] .keypad button { border-radius: 10px; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-pick { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 16px; background: var(--surface); font-size: 11.5px; font-weight: 800; color: var(--ink-2); text-align: center; line-height: 1.15; box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow .15s, background .15s; }
.cat-pick .e { font-size: 24px; }
.cat-pick.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); color: var(--ink); }

/* gráficos */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .axis-t { fill: var(--muted); font-size: 11px; font-weight: 700; font-family: var(--font-body); }
.chart .lbl-t { fill: var(--ink-2); font-size: 11.5px; font-weight: 800; font-family: var(--font-body); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; font-weight: 800; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 4px; border-radius: 4px; margin-right: 6px; vertical-align: middle; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px) !important; }
.tip {
  position: fixed; z-index: 80; pointer-events: none; opacity: 0; transform: translate(-50%, -110%);
  background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 800; padding: 7px 10px; border-radius: 10px;
  white-space: nowrap; transition: opacity .12s; box-shadow: var(--shadow);
}
.tip.show { opacity: 1; }
.tip small { display: block; font-weight: 700; opacity: .75; }

/* metas */
.goal { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; padding: 6px 0; cursor: pointer; }
.goal + .goal { border-top: 1px solid var(--line); padding-top: 14px; }
.ring { position: relative; width: 64px; height: 64px; }
.ring svg { transform: rotate(-90deg); }
.ring .e { position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
.ring .fg.done { stroke: var(--good); }

/* avisos */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.banner.warn { background: var(--warn-soft); }
.banner.bad { background: var(--bad-soft); }
.banner.good { background: var(--good-soft); }
.banner .ic { flex: none; color: var(--accent-strong); margin-top: 1px; }
:root[data-mode="dark"] .banner .ic { color: var(--accent); }
.banner.warn .ic { color: var(--warn); }
.banner.bad .ic { color: var(--bad); }
.banner.good .ic { color: var(--good); }
.banner b { font-weight: 900; }
.alerts { display: flex; flex-direction: column; gap: 8px; }

.empty { text-align: center; padding: 26px 16px; color: var(--ink-2); }
.empty .e { font-size: 44px; margin-bottom: 6px; }
.empty h3 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 20px; color: var(--ink); margin-bottom: 4px; }

.toast {
  position: fixed; z-index: 90; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  display: flex; align-items: center; gap: 14px; max-width: min(440px, calc(100% - 32px));
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 16px;
  font-weight: 800; font-size: 14px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s, transform .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast button { color: var(--accent-soft); font-weight: 900; text-decoration: underline; }
:root[data-skin="sobrio"] .toast button { color: var(--gold); }

/* importação */
.drop {
  border: 2px dashed var(--accent); border-radius: var(--radius); padding: 26px 16px; text-align: center;
  background: var(--accent-soft); color: var(--ink); cursor: pointer; transition: transform .15s, background .2s;
}
.drop:hover, .drop.over { transform: scale(1.01); }
.drop input { display: none; }
.drop .big-ic { width: 58px; height: 58px; margin: 0 auto 8px; border-radius: 18px; display: grid; place-items: center; background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }
.imp-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; }
.imp-row + .imp-row { border-top: 1px solid var(--line); }
.imp-row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
.imp-row .cat-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 800; padding: 3px 9px 3px 6px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); margin-top: 3px; }
.imp-row.off .d, .imp-row.off .v { opacity: .45; text-decoration: line-through; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 14.5px; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 900; font-size: 13px; }

/* boas-vindas */
.welcome { min-height: 100%; display: flex; flex-direction: column; padding: calc(30px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); gap: 18px; animation: viewIn .4s ease both; }
.welcome .logo { width: 84px; height: 84px; border-radius: 28px; display: grid; place-items: center; background: linear-gradient(145deg, var(--hero-a), var(--hero-c)); color: #fff; box-shadow: var(--shadow); }
:root[data-skin="sobrio"] .welcome .logo { border-radius: 20px; }
.welcome h1 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 40px; line-height: 1.05; letter-spacing: -.02em; }
.welcome .lead { font-size: 18px; color: var(--ink-2); max-width: 32ch; margin: 0; }
.welcome .gift { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 8px 14px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow-sm); font-weight: 800; font-size: 14px; color: var(--accent-strong); }
:root[data-mode="dark"] .welcome .gift { color: var(--accent); }
.welcome .spacer { flex: 1; }
.feat { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.feat .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }
.feat b { display: block; }
.feat span { color: var(--ink-2); font-size: 14px; }
.ob-step { display: flex; flex-direction: column; gap: 16px; flex: 1; }
.ob-step h2 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 30px; line-height: 1.1; }
.ob-dots { display: flex; gap: 6px; }
.ob-dots i { height: 6px; width: 18px; border-radius: 9px; background: var(--line); transition: width .3s, background .3s; }
.ob-dots i.on { width: 34px; background: var(--accent); }
.skin-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.skin-card { border-radius: 20px; padding: 12px; text-align: left; box-shadow: inset 0 0 0 2px var(--line); background: var(--surface); transition: box-shadow .2s, transform .15s; }
.skin-card.on { box-shadow: inset 0 0 0 3px var(--accent); transform: translateY(-2px); }
.skin-card .pv { height: 92px; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; font-weight: 900; }
.skin-card .pv small { font-weight: 700; opacity: .85; font-size: 11px; }
.skin-card .pv.rosa { background: linear-gradient(145deg, #f0709f, #d63f7a 55%, #a8326a); font-family: "Fraunces", Georgia, serif; font-size: 22px; }
.skin-card .pv.sobrio { background: linear-gradient(145deg, #1c4672, #12304f 55%, #0a1d33); border-top: 2px solid #c9a15e; font-family: "Manrope", system-ui, sans-serif; font-size: 20px; border-radius: 10px; }
.skin-card .nm { font-weight: 900; margin-top: 8px; }
.skin-card .ds { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.choice { display: grid; grid-template-columns: 44px 1fr 24px; gap: 12px; align-items: center; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); text-align: left; width: 100%; }
.choice.on { box-shadow: inset 0 0 0 3px var(--accent); }
.choice .bk { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 15px; }
.choice .ck { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; color: var(--accent-ink); }
.choice.on .ck { background: var(--accent); box-shadow: none; }

.sample-banner { margin: 0 18px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--warn-soft); color: var(--ink); font-size: 13.5px; font-weight: 700; }
.sample-banner button { margin-left: auto; font-weight: 900; color: var(--warn); white-space: nowrap; }

.hide-values .money-v { filter: blur(7px); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 95; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

</style>

<body>
<div class="stage">
  <div class="app" id="app"><div class="welcome"><h1>Dindin</h1><p class="lead">Carregando…</p></div></div>
</div>
<div id="layer"></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   Dindin — leitura de extratos e faturas + categorização
   Funções puras (sem DOM) para rodar no navegador e no Node.
   ============================================================ */
(function (root) {
  'use strict';

  /* ---------- texto ---------- */
  function normalize(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/[•·]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function decodeBuffer(buf) {
    var bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    // BOM UTF-8
    if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) bytes = bytes.subarray(3);
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (e) {
      try { return new TextDecoder('windows-1252').decode(bytes); }
      catch (e2) { return new TextDecoder('latin1').decode(bytes); }
    }
  }

  /* ---------- números ---------- */
  function parseNumber(raw) {
    if (raw == null) return NaN;
    if (typeof raw === 'number') return raw;
    var s = String(raw).trim();
    if (!s) return NaN;
    var neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (/-\s*$/.test(s)) { neg = true; s = s.replace(/-\s*$/, ''); }
    if (/^\s*[-−–]/.test(s) || /R\$\s*[-−–]/.test(s)) neg = true;
    if (/\bD\s*$/i.test(s)) { neg = true; }           // "123,45 D" (débito)
    s = s.replace(/[^\d.,]/g, '');
    if (!s) return NaN;
    var lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
    var num;
    if (lastComma > -1 && lastDot > -1) {
      if (lastComma > lastDot) num = parseFloat(s.replace(/\./g, '').replace(',', '.'));
      else num = parseFloat(s.replace(/,/g, ''));
    } else if (lastComma > -1) {
      if ((s.match(/,/g) || []).length > 1) num = parseFloat(s.replace(/,/g, ''));
      else num = parseFloat(s.replace(',', '.'));
    } else if (lastDot > -1) {
      if (/^\d{1,3}(\.\d{3})+$/.test(s) && (s.match(/\./g) || []).length > 1) num = parseFloat(s.replace(/\./g, ''));
      else num = parseFloat(s);
    } else num = parseFloat(s);
    if (isNaN(num)) return NaN;
    return neg ? -Math.abs(num) : num;
  }

  /* ---------- datas ---------- */
  var MES = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12,
    feb: 2, apr: 4, may: 5, aug: 8, sep: 9, oct: 10, dec: 12 };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function mk(y, m, d) {
    y = +y; m = +m; d = +d;
    if (y < 100) y += 2000;
    if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y > 1990 && y < 2100)) return null;
    return y + '-' + pad(m) + '-' + pad(d);
  }
  function parseDate(raw, pref) {
    if (!raw) return null;
    var s = String(raw).trim(), m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return mk(m[1], m[2], m[3]);
    if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return mk(m[1], m[2], m[3]);
    if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))) {
      if (pref === 'mdy') return mk(m[3], m[1], m[2]);
      return mk(m[3], m[2], m[1]);
    }
    if ((m = normalize(s).match(/^(\d{1,2})\s*(?:de\s+)?([a-z]{3})[a-z]*\.?\s*(?:de\s+)?(\d{2,4})?/))) {
      var mo = MES[m[2]];
      if (mo) return mk(m[3] || new Date().getFullYear(), mo, m[1]);
    }
    return null;
  }

  /* ---------- CSV ---------- */
  function detectDelimiter(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); }).slice(0, 40);
    if (!lines.length) return ',';
    function share(ch) { return lines.filter(function (l) { return l.indexOf(ch) > -1; }).length / lines.length; }
    if (share('\t') >= 0.5) return '\t';
    if (share(';') >= 0.5) return ';';
    if (share('|') >= 0.6 && share(',') < 0.3) return '|';
    return ',';
  }
  function splitCSVLine(line, d) {
    var out = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (q) {
        if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === d) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(function (x) { return x.trim(); });
  }
  function parseCSV(text, delim) {
    delim = delim || detectDelimiter(text);
    // junta linhas quebradas dentro de aspas
    var rows = [], buf = '', q = 0;
    text.split(/\r?\n/).forEach(function (line) {
      buf = buf ? buf + '\n' + line : line;
      q = (buf.match(/"/g) || []).length;
      if (q % 2 === 0) { if (buf.trim()) rows.push(splitCSVLine(buf, delim)); buf = ''; }
    });
    if (buf.trim()) rows.push(splitCSVLine(buf, delim));
    return { delim: delim, rows: rows };
  }

  /* ---------- parcelas e limpeza de descrição ---------- */
  function parseInstallment(desc) {
    var m = String(desc).match(/(?:-\s*)?parcela\s*(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})/i) ||
            String(desc).match(/\b(\d{1,2})\s*\/\s*(\d{1,2})\s*$/);
    if (!m) return null;
    var n = +m[1], t = +m[2];
    if (!(n >= 1 && t >= 2 && n <= t && t <= 48)) return null;
    return { n: n, total: t };
  }

  function prettyDesc(raw) {
    var s = String(raw || '').replace(/\s+/g, ' ').trim();
    var m;
    // Nubank conta
    if ((m = s.match(/^Transfer[êe]ncia enviada pelo Pix\s*-\s*([^-]+)/i))) return 'Pix para ' + titleCase(m[1]);
    if ((m = s.match(/^Transfer[êe]ncia recebida pelo Pix\s*-\s*([^-]+)/i))) return 'Pix de ' + titleCase(m[1]);
    if ((m = s.match(/^Transfer[êe]ncia [Rr]ecebida\s*-\s*([^-]+)/i))) return 'Transferência de ' + titleCase(m[1]);
    if ((m = s.match(/^Transfer[êe]ncia enviada\s*-\s*([^-]+)/i))) return 'Transferência para ' + titleCase(m[1]);
    if ((m = s.match(/^Reembolso recebido pelo Pix\s*-\s*([^-]+)/i))) return 'Reembolso de ' + titleCase(m[1]);
    if ((m = s.match(/^Compra no d[ée]bito(?: via NuPay)?\s*-\s*(.+)$/i))) return cleanMerchant(m[1]);
    if ((m = s.match(/^Pagamento de boleto efetuado\s*-\s*(.+)$/i))) return 'Boleto · ' + titleCase(m[1]);
    if ((m = s.match(/^D[ée]bito em conta\s*-\s*(.+)$/i))) return titleCase(m[1]);
    if (/^Pagamento de fatura/i.test(s)) return 'Pagamento da fatura';
    if (/^Pagamento recebido/i.test(s)) return 'Pagamento da fatura recebido';
    if (/^Aplica[çc][ãa]o RDB/i.test(s)) return 'Guardado na caixinha';
    if (/^Resgate RDB/i.test(s)) return 'Resgate da caixinha';
    return cleanMerchant(s);
  }
  function cleanMerchant(s) {
    s = String(s).replace(/\s*-\s*parcela\s*\d+\s*(\/|de)\s*\d+/i, '')
      .replace(/\*+/g, ' ').replace(/\s{2,}/g, ' ').trim();
    // remove duplicação "Ifood Ifood"
    var parts = s.split(' ');
    if (parts.length >= 2 && parts.length % 2 === 0) {
      var half = parts.length / 2;
      if (normalize(parts.slice(0, half).join(' ')) === normalize(parts.slice(half).join(' '))) s = parts.slice(0, half).join(' ');
    }
    // remove palavras repetidas em sequência ("Uber Uber Trip")
    s = s.split(' ').filter(function (w, i, a) { return i === 0 || normalize(w) !== normalize(a[i - 1]); }).join(' ');
    if (s === s.toUpperCase() || s === s.toLowerCase()) s = titleCase(s);
    return s;
  }
  function titleCase(s) {

    res[c.id] = v > 0 ? Math.max(10, Math.round(v / 10) * 10) : 0;
  });
  // ajusta para não passar de 80% da renda
  var tot = sum(Object.keys(res), function (k) { return res[k]; });
  if (target > 0 && tot > target) {
    var f = target / tot;
    Object.keys(res).forEach(function (k) { res[k] = res[k] ? Math.max(10, Math.round(res[k] * f / 10) * 10) : 0; });
  }
  // nunca abaixo das contas fixas daquela categoria
  activeBills().forEach(function (b) { floor[b.cat] = (floor[b.cat] || 0) + b.amount; });
  Object.keys(floor).forEach(function (k) { if (res[k] != null) res[k] = Math.max(res[k], Math.ceil(floor[k] / 10) * 10); });
  return { values: res, income: inc, usedHistory: hasHist };
}

/* ---------- contas fixas ---------- */
function billStatus(b, ym) {
  var paid = (P().billPaid[ym] || {})[b.id];
  var per = periodOf(ym);
  var day = Math.min(b.day || 1, daysInMonth(ym));
  var due = ym + '-' + pad2(day);
  if ((P().profile.startDay || 1) > 1 && due < per.start) due = addMonths(ym, 1) + '-' + pad2(Math.min(b.day, daysInMonth(addMonths(ym, 1))));
  if (paid) return { state: 'paid', due: due, txId: paid };
  var t = todayYMD();
  var d = daysBetween(t, due);
  if (d < 0) return { state: 'late', due: due, days: -d };
  if (d <= 3) return { state: 'soon', due: due, days: d };
  return { state: 'open', due: due, days: d };
}
function activeBills() { return P().bills.filter(function (b) { return b.active !== false; }); }
function matchBills(newTx) {
  // após importar: liga contas fixas a lançamentos parecidos
  var p = P(), linked = 0;
  newTx.forEach(function (t) {
    if (!isSpend(t)) return;
    var n = norm(t.desc + ' ' + (t.raw || ''));
    activeBills().forEach(function (b) {
      var ym = t.comp;
      p.billPaid[ym] = p.billPaid[ym] || {};
      if (p.billPaid[ym][b.id]) return;
      var words = norm(b.match || b.name).split(/[ ,]+/).filter(function (w) { return w.length >= 3; });
      if (!words.length || !words.some(function (w) { return n.indexOf(w) > -1; })) return;
      var diff = Math.abs(-t.v - b.amount) / Math.max(1, b.amount);
      if (diff > 0.2) return;
      p.billPaid[ym][b.id] = t.id; t.billId = b.id; linked++;
    });
  });
  return linked;
}

/* ---------- metas ---------- */
function goalSaved(g) { return round2(sum(g.moves || [], function (m) { return m.v; })); }
function goalMonthly(g) {
  if (!g.deadline) return null;
  var left = g.target - goalSaved(g); if (left <= 0) return 0;
  var months = Math.max(1, (+g.deadline.slice(0, 4) - +todayYMD().slice(0, 4)) * 12 + (+g.deadline.slice(5, 7) - +todayYMD().slice(5, 7)) + 1);
  return round2(left / months);
}

/* ---------- sincronização opcional (conta Claude) ---------- */
var Cloud = {
  db: null, col: null, status: 'off', timer: null, pushed: {}, busy: false, pending: false,
  init: function () {
    var self = this;
    if (!window.claude || typeof window.claude.use !== 'function') return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return;
        self.db = db; self.col = db.collection('data/users/' + id);
        self.status = 'syncing'; App.refreshSync();
        return self.pull();
      });
    }).catch(function () { self.status = 'off'; App.refreshSync(); });
  },
  chunks: function () {
    var out = { root: { order: S.order, active: S.active, updatedAt: S.updatedAt || 0, months: {} } };
    S.order.forEach(function (pid) {
      var p = S.profiles[pid]; if (!p) return;
      var meta = {}; Object.keys(p).forEach(function (k) { if (k !== 'tx') meta[k] = p[k]; });
      out['p-' + pid] = meta;
      var byM = {};
      p.tx.forEach(function (t) { (byM[t.comp] = byM[t.comp] || []).push(t); });
      out.root.months[pid] = Object.keys(byM).sort();
      Object.keys(byM).forEach(function (m) { out['p-' + pid + '-tx-' + m] = { list: byM[m] }; });
    });
    return out;
  },
  pull: function () {
    var self = this;
    var timeout = new Promise(function (_, rej) { setTimeout(function () { rej({ code: 'timeout' }); }, 10000); });
    return Promise.race([self.col.doc('root').get(), timeout]).then(function (snap) {
      if (!snap.exists) { self.status = 'ready'; App.refreshSync(); if (S && S.order.length) self.schedule(10); return; }
      var root = snap.data();
      if ((root.updatedAt || 0) <= (S && S.updatedAt || 0)) { self.status = 'ready'; App.refreshSync(); self.schedule(10); return; }
      // remoto é mais novo: baixa tudo
      var ns = { v: 1, order: root.order.slice(), active: root.active, profiles: {}, updatedAt: root.updatedAt };
      var jobs = [];
      root.order.forEach(function (pid) {
        jobs.push(self.col.doc('p-' + pid).get().then(function (s) { if (s.exists) { ns.profiles[pid] = clone(s.data()); ns.profiles[pid].tx = []; } }));
      });
      return Promise.all(jobs).then(function () {
        var tj = [];
        root.order.forEach(function (pid) {
          (root.months[pid] || []).forEach(function (m) {
            tj.push(self.col.doc('p-' + pid + '-tx-' + m).get().then(function (s) { if (s.exists && ns.profiles[pid]) ns.profiles[pid].tx = ns.profiles[pid].tx.concat(clone(s.data().list || [])); }));
          });
        });
        return Promise.all(tj);
      }).then(function () {
        if (!Object.keys(ns.profiles).length) { self.status = 'ready'; App.refreshSync(); return; }
        S = migrate(ns); if (!S.profiles[S.active]) S.active = S.order[0];
        var c = self.chunks(); Object.keys(c).forEach(function (k) { self.pushed[k] = JSON.stringify(c[k]); });
        flushSave(); self.status = 'ready'; App.afterExternalLoad();
      });
    }).catch(function (e) { self.status = e && e.code === 'timeout' ? 'offline' : 'off'; App.refreshSync(); });
  },
  schedule: function (ms) {
    var self = this;
    if (!self.col || self.status === 'ro') return;
    clearTimeout(self.timer);
    self.timer = setTimeout(function () { self.push(); }, ms == null ? 1500 : ms);
  },
  push: function () {
    var self = this;
    if (!self.col || !S) return;
    if (self.busy) { self.pending = true; return; }
    self.busy = true; self.status = 'syncing'; App.refreshSync();
    var c = self.chunks();
    var keys = Object.keys(c).filter(function (k) { return k !== 'root' && self.pushed[k] !== JSON.stringify(c[k]); });
    var removed = Object.keys(self.pushed).filter(function (k) { return k !== 'root' && !c[k]; });
    var chain = Promise.resolve();
    keys.forEach(function (k) { chain = chain.then(function () { return self.col.doc(k).set(c[k]).then(function () { self.pushed[k] = JSON.stringify(c[k]); }); }); });
    removed.forEach(function (k) { chain = chain.then(function () { return self.col.doc(k).delete().then(function () { delete self.pushed[k]; }); }); });
    chain = chain.then(function () {
      var r = JSON.stringify(c.root);
      if (self.pushed.root === r) return;
      return self.col.doc('root').set(c.root).then(function () { self.pushed.root = r; });
    });
    chain.then(function () {
      self.busy = false; self.status = 'ready'; App.refreshSync();
      if (self.pending) { self.pending = false; self.schedule(300); }
    }).catch(function (e) {
      self.busy = false;
      self.status = e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked') ? 'ro' : 'error';
      App.refreshSync();
      if (self.status === 'error') self.schedule(8000);
    });
  },
};

/* ---------- gráficos ---------- */
function niceMax(v) {
  if (v <= 0) return 100;
  var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  var steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (var i = 0; i < steps.length; i++) if (n <= steps[i]) return steps[i] * p;
  return 10 * p;
}
function paceChart(ym, list, bud) {
  var per = periodOf(ym), total = daysBetween(per.start, per.end) + 1;
  var t = todayYMD(), lastIdx = ym === currentYM() ? daysBetween(per.start, t) : (t < per.start ? -1 : total - 1);
  var daily = new Array(total).fill(0);
  list.forEach(function (x) { if (isSpend(x)) { var i = daysBetween(per.start, x.date); if (i >= 0 && i < total) daily[i] += -x.v; } });
  var cum = [], acc2 = 0;

}

/* ---------- animações ---------- */
function countUp() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('[data-count]').forEach(function (el) {
    var key = UI.view + UI.month;
    if (countUpDone[key]) return;
    countUpDone[key] = true;
    var target = +el.getAttribute('data-count'), t0 = performance.now(), dur = 700;
    var span = el.querySelector('.money-v'); if (!span) return;
    function step(t) {
      var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      span.textContent = fmt(target * e);
      if (k < 1) requestAnimationFrame(step); else span.textContent = fmt(target);
    }
    requestAnimationFrame(step);
  });
}
function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
  var dpr = window.devicePixelRatio || 1, W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  cv.style.width = '100%'; cv.style.height = '100%';
  var ctx = cv.getContext('2d'), rosa = document.documentElement.getAttribute('data-skin') !== 'sobrio';
  var cs = getComputedStyle(document.documentElement);
  var colors = rosa ? ['#ff7aa8', '#d63f7a', '#ffc2d6', '#b98cf0', '#ffffff'] : [cs.getPropertyValue('--gold').trim() || '#c9a15e', '#1f6fb2', '#dfe4eb', '#ffffff'];
  var parts = Array.from({ length: 90 }, function () { return { x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45, vx: (Math.random() - .5) * 14 * dpr, vy: (-Math.random() * 14 - 6) * dpr, r: (4 + Math.random() * 6) * dpr, c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3 }; });
  var t0 = performance.now();
  function heart(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s * .3); ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3); ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s); ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3); ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3); ctx.fill(); }
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    parts.forEach(function (p) { p.vy += .45 * dpr; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); if (rosa) heart(0, 0, p.r * 1.6); else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });

}

/* ---------- tooltip ---------- */
function showTip(x, y, a, b) { var tip = $('#tip'); tip.innerHTML = esc(a) + (b ? '<small>' + esc(b) + '</small>' : ''); tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('show'); }
function hideTip() { var t = $('#tip'); if (t) t.classList.remove('show'); $$('.hover-layer').forEach(function (g) { g.style.display = 'none'; }); }
function onChartMove(e) {
  var el = e.target;
  if (!el || !el.getAttribute) return;
  if (el.hasAttribute('data-tip')) {
    var r = el.getBoundingClientRect();
    showTip(r.left + r.width / 2, r.top + 30, el.getAttribute('data-tip'), el.getAttribute('data-tip2'));
    return;
  }
  var id = el.getAttribute('data-chart');
  if (!id || !CHARTS[id]) { return; }
  var c = CHARTS[id], svg = el.ownerSVGElement, rect = svg.getBoundingClientRect();
  var sx = (e.clientX - rect.left) / rect.width * c.W;
  var i = Math.round((sx - c.L) / (c.W - c.L - c.R) * (c.n - 1));
  i = clamp(i, 0, c.n - 1);
  var xx = c.L + (c.W - c.L - c.R) * (c.n === 1 ? 0 : i / (c.n - 1));
  var date = addDays(c.start, i);
  var g = svg.querySelector('.hover-layer');
  var planned = c.bud ? c.bud * (i + 1) / c.total : null;
  if (i < c.cum.length) {
    var v = c.cum[i], yy = c.T + (c.H - c.T - c.B) * (1 - v / c.maxV);
    g.style.display = ''; g.querySelector('.hl').setAttribute('x1', xx); g.querySelector('.hl').setAttribute('x2', xx);
    g.querySelector('.hd').setAttribute('cx', xx); g.querySelector('.hd').setAttribute('cy', yy);
    showTip(rect.left + xx / c.W * rect.width, rect.top + yy / c.H * rect.height - 8, dateShort(date) + ': ' + fmt(v) + ' gastos', planned != null ? 'Planejado até aqui: ' + fmt(planned) : '');
  } else {
    g.style.display = 'none';
    showTip(rect.left + xx / c.W * rect.width, rect.top + 40, dateShort(date), planned != null ? 'Planejado até aqui: ' + fmt(planned) : '');
  }
}

/* ---------- backup ---------- */
var Backup = {
  export: function () {
    var data = JSON.stringify({ app: 'dindin', v: 1, exportedAt: new Date().toISOString(), state: S }, null, 1);
    var name = 'dindin-backup-' + todayYMD() + '.json';
    var done = function () { toast('Backup salvo'); };
    var fallback = function () {
      try {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
        a.download = name; document.body.appendChild(a); a.click(); a.remove();
        var framed = false; try { framed = window.top !== window.self; } catch (x) { framed = true; }
        if (framed) setTimeout(function () { Backup.showText(data); }, 600); else done();
      } catch (e) { Backup.showText(data); }
    };
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (dl) {
        if (!dl) return fallback();
        dl.save({ filename: name, data: data }).then(done).catch(function (err) { if (err && /cancel|declin|denied/i.test(String(err.code || err.message || ''))) return; Backup.showText(data); });
      }).catch(fallback);
    } else fallback();
  },
  showText: function (data) {
    var e = openSheet({
      title: 'Cópia de segurança',
      body: '<p class="sub" style="margin:0">Se o arquivo não baixou, copie o texto abaixo e guarde num lugar seguro (Notas, e-mail para você mesma). Para restaurar, cole num arquivo .json.</p><textarea class="input" readonly style="min-height:180px;font-size:12px;font-family:ui-monospace,monospace">' + esc(data) + '</textarea>',
      foot: '<button class="btn block" data-x="copy">' + ic('copy', 18) + ' Copiar</button>',
    });
    e.el.querySelector('[data-x=copy]').onclick = function () {
      var ta = e.el.querySelector('textarea');
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(data) : Promise.reject()).then(function () { toast('Copiado'); }).catch(function () { ta.select(); try { document.execCommand('copy'); toast('Copiado'); } catch (x) { toast('Selecione e copie o texto'); } });
    };
  },
  restore: function (file) {
    file.text().then(function (txt) {
      var obj; try { obj = JSON.parse(txt); } catch (e) { toast('Esse arquivo não é um backup do Dindin'); return; }
      var st = obj && obj.state;
      if (!st || !st.profiles || !st.order) { toast('Esse arquivo não é um backup do Dindin'); return; }
      var names = st.order.map(function (k) { return st.profiles[k] && st.profiles[k].profile.name; }).filter(Boolean).join(', ');
      ask({
        title: 'Restaurar backup?', yes: 'Restaurar',
        text: 'Backup de ' + new Date(obj.exportedAt).toLocaleString('pt-BR') + (names ? ' com os perfis: <b>' + esc(names) + '</b>' : '') + '. Os dados atuais deste aparelho serão substituídos.',
        onYes: function () { S = migrate(st); S.updatedAt = Date.now(); flushSave(); Cloud.schedule(10); applyTheme(); UI.month = currentYM(); App.go('inicio'); toast('Backup restaurado'); },
      });
    });
  },
};

var Importer = {
  libs: {},
  loadScript: function (src) {
    if (this.libs[src]) return this.libs[src];
    this.libs[src] = new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function () { rej(new Error('lib')); }; document.head.appendChild(s); });
    return this.libs[src];
  },
  read: function (file) {
    var self = this, name = file.name || 'arquivo', ext = (name.split('.').pop() || '').toLowerCase();
    var loading = openSheet({ title: 'Lendo arquivo…', body: '<div class="empty"><div class="e">📄</div><p class="sub">' + esc(name) + '</p></div>' });
    var fail = function (msg) { closeSheet(loading); ask({ title: 'Não consegui ler', text: msg, yes: 'Entendi', no: 'Fechar', onYes: function () { } }); };
    if (ext === 'pdf') {
      self.readPdf(file).then(function (lines) {
        closeSheet(loading);
        var r = Parsers.parsePdfLines(lines, {});
        if (!r.items.length) return fail('Não encontrei lançamentos neste PDF. Se for do Nubank, prefira exportar em <b>CSV</b> ou <b>OFX</b>, que são lidos com precisão.');
        r.label = r.accountType === 'cartao' ? 'Fatura em PDF' : 'Extrato em PDF'; r.file = name; r.pdf = true;
        self.preview(r);
      }).catch(function () { fail('Não deu para abrir o PDF agora. Tente o arquivo em CSV ou OFX.'); });
      return;
    }
    if (ext === 'xls' || ext === 'xlsx') {
      Promise.all([self.loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'), file.arrayBuffer()]).then(function (r) {
        var wb = window.XLSX.read(r[1], { type: 'array' });
        var rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }).map(function (row) { return row.map(function (c) { return String(c); }); });
        closeSheet(loading); self.generic(rows, name);
      }).catch(function () { fail('Não deu para abrir a planilha. Tente salvar como CSV.'); });
      return;
    }
    file.arrayBuffer().then(function (buf) {
      var text = Parsers.decodeBuffer(buf);
      var kind = Parsers.detect(name, text), hints = Parsers.fileHints(name), r;
      closeSheet(loading);
      if (kind === 'nubank-cartao') { r = Parsers.parseNubankCard(text); r.label = 'Fatura do cartão Nubank'; r.faturaMonth = hints.faturaMonth || null; }
      else if (kind === 'nubank-conta') { r = Parsers.parseNubankConta(text); r.label = 'Extrato da conta Nubank'; }
      else if (kind === 'ofx') {
        r = Parsers.parseOFX(text);
        r.label = (r.accountType === 'cartao' ? 'Fatura ' : 'Extrato ') + (r.bank === 'nubank' ? 'Nubank' : r.bank === 'safra' ? 'Safra' : 'OFX');
      } else { var csv = Parsers.parseCSV(text); return self.generic(csv.rows, name); }
      r.file = name;
      if (!r.items.length) return fail('O arquivo foi aberto, mas não encontrei lançamentos nele.');
      self.preview(r);
    }).catch(function () { fail('Não consegui abrir este arquivo.'); });
  },
  readPdf: function (file) {
    var self = this, base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    return self.loadScript(base + 'pdf.min.js').then(function () { return self.loadScript(base + 'pdf.worker.min.js'); }).then(function () {
      var lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
      return file.arrayBuffer().then(function (buf) { return lib.getDocument({ data: buf, isEvalSupported: false }).promise; });
    }).then(function (pdf) {
      var pages = []; for (var i = 1; i <= Math.min(pdf.numPages, 30); i++) pages.push(pdf.getPage(i).then(function (pg) { return pg.getTextContent(); }));
      return Promise.all(pages);
    }).then(function (contents) {
      var lines = [];
      contents.forEach(function (tc) {
        var rows = {};
        tc.items.forEach(function (it) { var y = Math.round(it.transform[5] / 2.5); (rows[y] = rows[y] || []).push(it); });
        Object.keys(rows).sort(function (a, b) { return b - a; }).forEach(function (y) {
          var its = rows[y].sort(function (a, b) { return a.transform[4] - b.transform[4]; });
          var s = '', lastX = null;
          its.forEach(function (it) { var x = it.transform[4]; if (lastX != null && x - lastX > 8) s += '  '; else if (lastX != null) s += ' '; s += it.str; lastX = x + (it.width || 0); });
          if (s.trim()) lines.push(s.trim());
        });
      });
      return lines;
    });
  },
  generic: function (rows, name) {
    rows = rows.filter(function (r) { return r.some(function (c) { return String(c).trim(); }); });
    if (rows.length < 2) { ask({ title: 'Arquivo vazio', text: 'Não encontrei linhas com dados neste arquivo.', yes: 'Ok', onYes: function () { } }); return; }

      else if (a === 'cancel') { app.onclick = null; self.draft = null; applyTheme(); App.route(); }
      else if (a === 'sample') self.finish(true);
      else if (a === 'finish') self.finish(false);
      else if (a === 'finish-skip') { d.income = 0; self.finish(false); }
    };
    function applyThemeDraft() { var root = document.documentElement; root.setAttribute('data-skin', d.skin); var dark = d.mode === 'auto' ? (root.getAttribute('data-theme') ? root.getAttribute('data-theme') === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) : d.mode === 'dark'; root.setAttribute('data-mode', dark ? 'dark' : 'light'); }
    applyThemeDraft();
    window.scrollTo(0, 0);
  },
  finish: function (sample) {
    var d = this.draft;
    var p = newProfile({ name: sample ? (d.name || '') : d.name.trim(), avatar: d.avatar, skin: d.skin, mode: d.mode, bank: d.bank });
    if (!S) S = { v: 1, order: [], active: null, profiles: {} };
    S.profiles[p.profile.id] = p; S.order.push(p.profile.id); S.active = p.profile.id;
    p.profile.onboarded = true;
    if (sample) makeSample(p);
    else if (d.income > 0) {
      p.income.base = round2(d.income);
      var sg = suggestBudget(currentYM());
      p.budget.base = sg.values;
    }
    $('#app').onclick = null; this.draft = null; KEYPAD = null;
    save(); applyTheme(); UI.month = currentYM(); UI.hidden = false; countUpDone = {};
    if (location.hash !== '#inicio') { try { location.hash = 'inicio'; } catch (e) { } }
    UI.view = 'inicio'; App.render();
    if (!sample) {
      confetti();
      setTimeout(function () {
        var e = openSheet({
          title: 'Tudo pronto' + (p.profile.name ? ', ' + p.profile.name : '') + '!',
          body: '<div class="empty" style="padding-top:4px"><div class="e">' + (p.profile.skin === 'rosa' ? '🌷' : '🧭') + '</div><p class="sub">' + (p.income.base ? 'Já deixei uma sugestão de orçamento com 20% da renda reservado para guardar. Ajuste quando quiser na aba Orçamento.' : 'Quando quiser, informe sua renda na aba Orçamento para receber uma sugestão.') + '</p></div>' +
            '<p style="margin:0;font-weight:800">Qual o próximo passo?</p>',
          foot: '<button class="btn ghost block" data-x="tx">Lançar um gasto</button><button class="btn block" data-x="imp">' + ic('upload', 18) + ' Importar extrato</button>',
        });
        e.el.querySelector('[data-x=imp]').onclick = function () { closeSheet(e); App.go('importar'); };
        e.el.querySelector('[data-x=tx]').onclick = function () { closeSheet(e); txForm(); };
      }, 450);
    } else toast('Explore à vontade. Quando quiser, toque em “Começar de verdade”.');
  },
};

document.addEventListener('DOMContentLoaded', function () { App.init(); });

</script>
